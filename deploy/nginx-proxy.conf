# AI 网关 Docker 版 —— Nginx 反代配置（宝塔面板）
# 端口默认 3002。把两处 your-domain.com 换成你的域名。

# ============================================================
# 用法（宝塔）：
#   1. 网站 → 添加站点（PHP 选「纯静态」，不建数据库）
#   2. 终端执行下面命令，把本文件放到反代目录：
#        mkdir -p /www/server/panel/vhost/nginx/proxy/你的域名/
#        rm -f /www/server/panel/vhost/nginx/proxy/你的域名/*.conf
#        # 把本文件内容写入该目录下的 ai-gateway.conf
#        nginx -t && systemctl reload nginx
#   3. 站点 → SSL → Let's Encrypt → 申请 → 强制 HTTPS
# ============================================================

#PROXY-START/
location / {
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / SSE 升级
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ---- SSE 流式输出必需，缺一不可 ----
    proxy_buffering off;           # 不缓冲，否则攒成一坨再吐
    proxy_cache off;               # 不缓存
    chunked_transfer_encoding on;  # 保持分块传输
    gzip off;                      # gzip 也会缓冲 SSE

    # 编程工具 / Agent 场景建议放宽到 3600s
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
}
#PROXY-END/
